# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# acp-agent 开发任务。
#   task          → 列出全部任务
#   task check    → 提交前必过（fmt + vet + test）
#   task ci       → 等价于 CI 全流程
#
# 约定：Task 内置 shell（mvdan/sh）解析，Windows 下无需 Git-Bash。

version: '3'

vars:
  PROG: acp-agent
  BIN: bin
  DIST: dist
  # 可执行文件后缀。注意 Task 的 OS 变量：裸名 OS 才是 "windows"，
  # 带点的 .OS 是 "Windows_NT"；.exeExt 在本版本不可靠，一律自己算。
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  # 版本号：优先取 git 描述，非 git 仓库回退源码里的默认值。
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo 0.1.0
  # -s -w 去符号表；-X 注入 cmd/acp-agent 的 version 变量。
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  # 默认构建的 build tag：**空** = 轻量版（约 20MB，中文分词器退化为
  # kernel.RuneSegmenter 的单字 + bigram）。
  TAGS: ''
  # 中文分词器（gse）的 build tag。`ne` 不能漏：没有它，gse 自己 embed 的
  # 简/繁/日词典与 idf 表（约 31MB）会被 linker 全部保留，二进制会是 52MB
  # 而不是 22MB。用 `task build:full` 构建。
  SEG_TAGS: 'segmenter ne'

set: [pipefail]

tasks:
  default:
    desc: 列出全部任务
    cmds:
      - '{{.TASK_EXE}} --list'
    silent: true

  # ── 构建 ────────────────────────────────────────────────────────────────

  build:
    desc: 构建主程序到 bin/（轻量版，约 20MB，未链接分词词典 → 检索走单字 + bigram）
    aliases: [b]
    # build 与 build:full 写同一个产物路径，各自的 checksum 会互相“以为已最新”，
    # 导致切回去时拿到另一个变体。用 method: none 每次都调 go build
    # （编译缓存命中时不到 3s）。
    method: none
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - internal/segmenter/dict_*.txt
      - go.mod
      - go.sum
      # Taskfile 本身也算输入：改 TAGS/LDFLAGS 后必须重新构建。
      - Taskfile.yml
    generates:
      - '{{.BIN}}/{{.PROG}}{{.EXE}}'
    cmds:
      - go build -tags '{{.TAGS}}' -trimpath -ldflags '{{.LDFLAGS}}' -o '{{.BIN}}/{{.PROG}}{{.EXE}}' ./cmd/acp-agent
      # Windows 上 go build 覆盖运行中的 exe 时会把旧文件重命名成 xxx~（占 50MB）。
      # 进程没退出时删不掉，所以忽略错误；下次构建再清。
      - cmd: rm -f '{{.BIN}}/{{.PROG}}{{.EXE}}~'
        ignore_error: true

  build:full:
    desc: 构建带中文分词器的版本到 bin/（约 22MB，启动即默认用 gse，无需任何开关）
    aliases: [bf]
    method: none
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - internal/segmenter/dict_*.txt
      - go.mod
      - go.sum
      - Taskfile.yml
    generates:
      - '{{.BIN}}/{{.PROG}}{{.EXE}}'
    cmds:
      # -tags "segmenter ne"：segmenter 启用 gse，ne 关掉 gse 自带的 31MB embed。
      - go build -tags '{{.SEG_TAGS}}' -trimpath -ldflags '{{.LDFLAGS}}' -o '{{.BIN}}/{{.PROG}}{{.EXE}}' ./cmd/acp-agent
      - cmd: rm -f '{{.BIN}}/{{.PROG}}{{.EXE}}~'
        ignore_error: true

  # 系统里的 `pi` 命令指向 bin/pi.exe（bin/ 已在用户 PATH 首位）。
  # 单独一个任务：`go build` 的产物名是 acp-agent.exe，直接用它的话
  # bin/pi.exe 会一直是旧版本，`pi` 跑起来看不出问题却已经不是最新代码。
  build:pi:
    desc: 构建到 bin/pi.exe（系统 pi 命令指向这个文件）
    aliases: [bp]
    method: none
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - internal/segmenter/dict_*.txt
      - go.mod
      - go.sum
      - Taskfile.yml
    generates:
      - '{{.BIN}}/pi{{.EXE}}'
    cmds:
      - go build -tags '{{.TAGS}}' -trimpath -ldflags '{{.LDFLAGS}}' -o '{{.BIN}}/pi{{.EXE}}' ./cmd/acp-agent
      - cmd: rm -f '{{.BIN}}/pi{{.EXE}}~'
        ignore_error: true

  build:all:
    desc: 构建全部 cmd/ 下的程序
    cmds:
      - for: { var: PROGRAMS }
        cmd: go build -tags '{{.TAGS}}' -trimpath -o '{{.BIN}}/{{.ITEM}}{{.EXE}}' ./cmd/{{.ITEM}}
    vars:
      PROGRAMS:
        - acp-agent
        - verify-kernel

  install:
    desc: go install 到 $GOBIN（默认轻量版；带分词器：task install TAGS="segmenter ne"）
    cmds:
      - go install -tags '{{.TAGS}}' -trimpath -ldflags '{{.LDFLAGS}}' ./cmd/acp-agent

  cross:
    desc: 交叉编译发布矩阵到 dist/（带中文分词器，纯 Go 无 cgo）
    cmds:
      - |
        set -e
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          os=${target%/*}; arch=${target#*/}
          ext=""; [ "$os" = windows ] && ext=".exe"
          dir="{{.DIST}}/${os}-${arch}"
          out="${dir}/{{.PROG}}${ext}"
          # 直接拼目录，不要用 dirname：Task 的内置 shell 不带 coreutils，
          # 干净环境下 `$(dirname ...)` 会失败并让整个 cross 中断。
          mkdir -p "$dir"
          echo "→ $out"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
            go build -tags '{{.SEG_TAGS}}' -trimpath -ldflags '{{.LDFLAGS}}' -o "$out" ./cmd/acp-agent
        done

  # ── 测试 ────────────────────────────────────────────────────────────────

  test:
    desc: 全量测试
    aliases: [t]
    cmds:
      - go test ./... {{.CLI_ARGS}}

  test:race:
    desc: 全量测试 + 竞态检测（慢，CI 用）
    cmds:
      - go test -race -count=1 ./... {{.CLI_ARGS}}

  test:cover:
    desc: 覆盖率报告 → coverage.html
    cmds:
      - go test -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -func=coverage.out | tail -1
      - go tool cover -html=coverage.out -o coverage.html
      - echo "已生成 coverage.html"
    silent: false

  test:pkg:
    desc: 只测某个包，如 task test:pkg -- kernel
    cmds:
      - go test ./internal/{{.CLI_ARGS}}/ -count=1

  test:native:
    desc: 用系统 shell（Git Bash）跑 tools 测试（默认走内置解释器）
    cmds:
      - go test -tags shellnative ./internal/tools -count=1

  bench:
    desc: kernel 基准测试
    cmds:
      - go test ./internal/kernel/ -bench=. -benchmem -run='^$' -count=1 {{.CLI_ARGS}}

  # ── 质量 ────────────────────────────────────────────────────────────────

  fmt:
    desc: gofmt 全部源码
    cmds:
      - gofmt -w ./cmd ./internal

  fmt:check:
    desc: 检查格式（不改文件）
    cmds:
      - |
        out=$(gofmt -l ./cmd ./internal)
        if [ -n "$out" ]; then
          echo "以下文件未格式化，运行 `task fmt`:"
          echo "$out"
          exit 1
        fi
        echo "格式检查通过"

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint（需自行安装）
    preconditions:
      - sh: command -v golangci-lint
        msg: 未安装 golangci-lint，见 https://golangci-lint.run/usage/install/
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: 整理 go.mod
    cmds:
      - go mod tidy

  check:
    desc: 提交前必过：格式 + vet + 测试
    deps: [fmt:check, vet]
    cmds:
      - '{{.TASK_EXE}} test'

  ci:
    desc: CI 全流程
    cmds:
      - '{{.TASK_EXE}} check'
      - '{{.TASK_EXE}} test:race'
      - '{{.TASK_EXE}} test:native'
      - '{{.TASK_EXE}} build'
      # full 版走另一套 tag，必须单独验一遍能编过（含 gse 的 ne 组合）。
      - '{{.TASK_EXE}} build:full'
      - go test -tags '{{.SEG_TAGS}}' ./internal/segmenter ./cmd/acp-agent -count=1

  # ── 运行 ────────────────────────────────────────────────────────────────

  run:
    desc: 交互式 REPL（透传 flag：task run -- -m gpt-5）
    interactive: true
    cmds:
      - go run ./cmd/acp-agent {{.CLI_ARGS}}

  acp:
    desc: 以 ACP agent 模式启动（stdio JSON-RPC）
    interactive: true
    cmds:
      - go run ./cmd/acp-agent --acp {{.CLI_ARGS}}

  endpoints:
    desc: 列出内置服务端点与模型定价
    cmds:
      - go run ./cmd/acp-agent -endpoints

  mcp:
    desc: 连接 MCP server 并打印状态与工具清单
    cmds:
      - go run ./cmd/acp-agent -mcp-status {{.CLI_ARGS}}

  verify:kernel:
    desc: 裸 goja 全链路验证（不复用 internal/kernel）
    cmds:
      - go run ./cmd/verify-kernel

  # ── 资源 ────────────────────────────────────────────────────────────────

  dict:
    desc: 重新生成中文分词词表（从 gse 自带词典按词频裁剪）
    cmds:
      - go generate ./internal/segmenter
      - echo "词表已更新（跑 task test:pkg -- segmenter 确认切分 golden）"

  cjs:
    desc: 重新打包上游 ESM → internal/kernel/kernel.dist.cjs（需 node）
    preconditions:
      - sh: test -d "${KERNEL:-/tmp/billion-context/kernel}/node_modules"
        msg: 找不到上游仓库的 node_modules，先 clone billion-context/kernel 并 pnpm install
    sources:
      - script/build-cjs.sh
    generates:
      - internal/kernel/kernel.dist.cjs
    cmds:
      - bash script/build-cjs.sh
      - echo "kernel.dist.cjs 已更新（记得 task build）"

  clean:
    desc: 清理构建产物与覆盖率
    cmds:
      - rm -rf '{{.BIN}}' '{{.DIST}}' coverage.out coverage.html
      - rm -f acp-agent.exe kernel.test.exe
      - echo 已清理
    silent: true
